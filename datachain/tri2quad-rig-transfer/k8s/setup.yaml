apiVersion: batch/v1
kind: Job
metadata:
  name: liyumeng-tri2quad-rig-transfer-setup
  namespace: liyumeng
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      restartPolicy: Never
      schedulerName: volcano
      imagePullSecrets:
        - name: vast-secret
      containers:
        - name: setup
          image: ccr-23gxup9u-vpc.cnc.bj.baidubce.com/model/cuda:11.8.0-runtime-graphics-ffmpeg-uv
          workingDir: /mnt/pfs/users/liyumeng/code/NEXUS-Humanoid/datachain/tri2quad-rig-transfer
          command: ["/bin/sh", "-lc"]
          args:
            - >-
              UV_PROJECT_ENVIRONMENT=/mnt/pfs/users/liyumeng/.cache/tri2quad-rig-transfer/environment
              UV_CACHE_DIR=/mnt/pfs/users/liyumeng/.cache/tri2quad-rig-transfer/uv-cache
              UV_LINK_MODE=copy uv sync --locked
          resources:
            requests: {cpu: "4", memory: 8Gi, ephemeral-storage: 16Gi}
            limits: {cpu: "4", memory: 8Gi, ephemeral-storage: 16Gi}
          volumeMounts:
            - {name: user, mountPath: /mnt/pfs/users/liyumeng}
            - {name: share, mountPath: /mnt/pfs/share}
      volumes:
        - name: user
          hostPath: {path: /mnt/pfs/users/liyumeng}
        - name: share
          hostPath: {path: /mnt/pfs/share}
